schema_version = "1.0.0"

id = "lc_workflow_helper"
version = "0.5.2"
name = "LC Workflow helper"
tagline = "Workflow helpers for LC Blender production tasks"
maintainer = "Lubomir"
type = "add-on"

blender_version_min = "4.2.0"

license = [
  "SPDX:GPL-3.0-or-later",
]

[permissions]
files = "Export CAD runs, reports, CSV files, and extension archives"

[build]
paths_exclude_pattern = [
  "__pycache__/",
  ".git/",
  "dist/",
  "scripts/",
  "tests/",
  ".gitattributes",
  ".gitignore",
  "README.md",
]
